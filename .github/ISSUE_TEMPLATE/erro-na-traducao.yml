name: Erro na tradução
description: Texto cortado, em inglês, erro de português, travamento...
labels: ["erro"]
body:
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de problema
      options:
        - Texto cortado ou saindo da caixa
        - Texto ainda em inglês
        - Erro de português ou tradução estranha
        - Imagem com texto em inglês
        - Mil Anos de Sonhos (palavras fora do lugar)
        - Travamento ou tela preta
        - Problema na instalação
        - Outro
    validations:
      required: true
  - type: dropdown
    id: onde
    attributes:
      label: Onde você joga
      options: ["PC (LostOdysseyRecomp)", "Discos (Xenia ou Xbox 360)"]
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão da tradução
      placeholder: "v1.2"
    validations:
      required: true
  - type: input
    id: lugar
    attributes:
      label: Onde aconteceu
      description: Disco, cidade, mapa, cena, sonho ou menu.
      placeholder: "Disco 1, Uhra, depois da conversa com o Conselho"
    validations:
      required: true
  - type: textarea
    id: texto
    attributes:
      label: O que aparece e o que deveria aparecer
      description: Copie o texto da tela. Se for erro de português, sugira a correção.
    validations:
      required: true
  - type: textarea
    id: print
    attributes:
      label: Print da tela
      description: Arraste a imagem para cá. Ajuda muito!
  - type: input
    id: recomp
    attributes:
      label: Versão do LostOdysseyRecomp (ou do emulador) e sistema
      placeholder: "LostOdysseyRecomp 1.1.0 / Windows 11"
